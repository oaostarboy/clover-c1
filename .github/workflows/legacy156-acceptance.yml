name: Released 1.5.6 to candidate update, reply in flight (Linux, macOS, Windows)
on:
  push:
    branches: ['ci/legacy-156-acceptance-20261023']
permissions:
  contents: read
concurrency:
  group: legacy156-${{ github.run_id }}
  cancel-in-progress: false
env:
  TARGET_REF: 80b1bd6fe419acdcbc24d1669dada4b6eefe30f6
  TARGET_TREE: 80e968e02d74e2ce3015197e8c61439717e18db5
  OLD_156: 32d3e6728c71d1f7c8684b7b41ac1785cb8117a9
jobs:
  linux:
    name: Linux systemd / ${{ matrix.entry }} / ${{ matrix.layout }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - {entry: chat, layout: external}
          - {entry: cli, layout: external}
          - {entry: chat, layout: normal}
          - {entry: cli, layout: normal}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
          fetch-depth: 0
      - name: Real v1.5.6 install + systemd user service; /update with a reply in flight
        env:
          PREPARE_RUNNER_APT: 'true'
          MODE: update
          BASE: v1.5.6
          ENTRY: ${{ matrix.entry }}
          LAYOUT: ${{ matrix.layout }}
          LARGE_ROLLBACK_LANE: ${{ matrix.entry == 'cli' && matrix.layout == 'normal' && 'true' || 'false' }}
        run: python helpers/.github/native-proof/legacy156_service.py
      - name: Diagnostics even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          systemctl --user show clover-gateway.service > "$RUNNER_TEMP/evidence/unit-final.txt" 2>&1 || true
          journalctl --user -u clover-gateway.service --no-pager -n 300 > "$RUNNER_TEMP/evidence/journal.log" 2>&1 || true
          if test -d "$HOME/.clover/logs/update_receipts"; then cp -r "$HOME/.clover/logs/update_receipts" "$RUNNER_TEMP/evidence/"; fi
          for f in gateway_state.json .update_output.txt .update_exit_code .update_refusal.json; do
            if test -f "$HOME/.clover/$f"; then cp "$HOME/.clover/$f" "$RUNNER_TEMP/evidence/${f#.}"; fi
          done
          for f in "$HOME"/.clover/logs/update-output.last*.txt "$HOME"/.clover/logs/update-rollback.log "$HOME"/.clover/logs/gateway.log; do
            if test -f "$f"; then cp "$f" "$RUNNER_TEMP/evidence/"; fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacy156-linux-${{ matrix.entry }}-${{ matrix.layout }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
  macos:
    name: macOS launchd / ${{ matrix.entry }}
    runs-on: macos-15
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        entry: [terminal, gateway]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: false
      - name: Real v1.5.6 install + launchd service; update with a reply in flight
        env:
          ENTRY: ${{ matrix.entry }}
          LARGE_ROLLBACK_LANE: ${{ matrix.entry == 'terminal' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 helpers/.github/native-proof/legacy156_macos.py \
            --source "$GITHUB_WORKSPACE/source" --old "$OLD_156" --entry "$ENTRY" \
            --target "$TARGET_REF" --tree "$TARGET_TREE" \
            --evidence "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacy156-macos-${{ matrix.entry }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
  windows:
    name: Windows 11-class runner / ${{ matrix.entry }}
    runs-on: windows-2025
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        entry: [terminal, gateway]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_REF }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: false
      - name: Real v1.5.6 Windows startup entry; update with a reply in flight
        shell: bash
        env:
          ENTRY: ${{ matrix.entry }}
          LARGE_ROLLBACK_LANE: ${{ matrix.entry == 'terminal' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          uv run --no-project --with psutil python helpers/.github/native-proof/legacy156_windows.py \
            --source "$GITHUB_WORKSPACE/source" --old "$OLD_156" --entry "$ENTRY" \
            --target "$TARGET_REF" --tree "$TARGET_TREE" \
            --fixed-base e1eac70b63afcbf4152cb7c8e965f997d93cca32 \
            --evidence "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: legacy156-windows-${{ matrix.entry }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
