name: Native Windows secure-reader experiment (not release acceptance)
on:
  workflow_dispatch:
    inputs:
      target_ref:
        type: string
        required: true
      target_tree:
        type: string
        required: true
permissions:
  contents: read
jobs:
  security:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
      - name: Verify experiment source and hosted scope
        shell: pwsh
        env:
          TARGET: ${{ inputs.target_ref }}
          TREE: ${{ inputs.target_tree }}
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'hosted scope' }
          if ($env:TARGET -notmatch '^[0-9a-f]{40}$' -or $env:TREE -notmatch '^[0-9a-f]{40}$') { throw 'invalid pin' }
          if ((git rev-parse HEAD) -ne $env:TARGET -or (git rev-parse 'HEAD^{tree}') -ne $env:TREE) { throw 'source mismatch' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/evidence"
          git rev-parse HEAD 'HEAD^{tree}' | Out-File "$env:RUNNER_TEMP/evidence/source.txt"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
      - name: Locked disposable test interpreter
        shell: pwsh
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev
          if ($LASTEXITCODE -ne 0) { throw 'dependencies failed' }
      - name: Real Windows handle and nested terminal tests, no retries
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/Scripts:$PATH"
          bash scripts/run_tests.sh tests/agent/test_windows_audit_native.py tests/agent/test_windows_audit_paths.py -j 1 --file-retries 0 -o addopts= --junitxml="$RUNNER_TEMP/evidence/security.xml" > "$RUNNER_TEMP/evidence/security.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
