name: Native Windows receipt environment experiment (not release acceptance)
on:
  workflow_dispatch:
    inputs:
      target_ref:
        type: string
        required: true
      target_tree:
        type: string
        required: true
permissions:
  contents: read
jobs:
  environment:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: helpers
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
          path: source
      - name: Verify pins and run bounded read-only environment controls
        shell: pwsh
        env:
          TARGET: ${{ inputs.target_ref }}
          TREE: ${{ inputs.target_tree }}
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'hosted scope' }
          if ($env:TARGET -notmatch '^[0-9a-f]{40}$' -or $env:TREE -notmatch '^[0-9a-f]{40}$') { throw 'invalid pin' }
          if ((git -C source rev-parse HEAD) -ne $env:TARGET -or (git -C source rev-parse 'HEAD^{tree}') -ne $env:TREE) { throw 'source mismatch' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/evidence"
          git -C source rev-parse HEAD 'HEAD^{tree}' | Out-File "$env:RUNNER_TEMP/evidence/source.txt"
          python helpers/.github/native-proof/clock_environment_probe.py --source "$env:GITHUB_WORKSPACE/source" --evidence "$env:RUNNER_TEMP/evidence"
          if ($LASTEXITCODE -ne 0) { throw 'environment probe failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-receipt-environment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
