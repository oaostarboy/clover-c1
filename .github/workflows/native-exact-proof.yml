name: Exact-target owner onboarding native diagnostics
on:
  workflow_dispatch:
    inputs:
      target_ref:
        type: string
        required: true
      target_tree:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: owner-native-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  native:
    name: Owner persistence, policy, wire and console / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Use literal Git bytes on disposable runner
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: helpers
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Refuse a different product
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_TREE: ${{ inputs.target_tree }}
        run: |
          set -euo pipefail
          test "$TARGET_REF" = de9df79dad8e07ba27b4e6dd1c9c674701dca70b
          test "$TARGET_TREE" = 23b47f3cc04be64bc3e93be16d2d092ec28c83a9
          test "$(git -C source rev-parse HEAD)" = "$TARGET_REF"
          test "$(git -C source rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git -C source status --porcelain --untracked-files=no)"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: false
      - name: Install locked dependencies in disposable exact-source venv
        shell: bash
        working-directory: source
        run: uv sync --locked --python 3.11 --extra all --extra dev --extra messaging
      - name: Canonical one-worker no-retry offline native evidence
        shell: bash
        run: uv run --project source --no-sync python helpers/.github/owner-native/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-native-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-native-evidence
          if-no-files-found: error
