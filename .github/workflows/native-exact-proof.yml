name: Desktop performance candidate native verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Checkout verification helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helper
          persist-credentials: false
      - name: Checkout exact product
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 7c43ea32629ceff116a047515f1185890ccf081f
          path: product
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - name: Validate source and install locked dependencies
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7c43ea32629ceff116a047515f1185890ccf081f
          test -z "$(git status --porcelain)"
          node --version; npm --version
          npm ci
      - name: Build desktop
        working-directory: product/apps/desktop
        shell: bash
        run: GITHUB_SHA=7c43ea32629ceff116a047515f1185890ccf081f GITHUB_REF_NAME=candidate-2.0.2.4 npm run build
      - name: Package desktop
        working-directory: product/apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then npm run builder -- --mac zip --publish never; else npm run builder -- --win dir --publish never; fi
      - name: Inspect package and launch with fake boot
        shell: bash
        run: node helper/.github/native-desktop-trial.mjs
      - name: Upload evidence and package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-native-${{ matrix.os }}
          path: |
            product/apps/desktop/release/**
            product/apps/desktop/build/install-stamp.json
            native-evidence.json
          if-no-files-found: warn
          retention-days: 7
