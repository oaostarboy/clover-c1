name: Cold bounded CIM sampler experiment (not acceptance)
on:
  workflow_dispatch:
    inputs:
      target_ref:
        type: string
        required: true
      target_tree:
        type: string
        required: true
permissions:
  contents: read
jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        first: [full, filtered]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: helpers
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
          path: source
      - name: Verify source and disposable scope
        shell: pwsh
        env:
          TARGET: ${{ inputs.target_ref }}
          TREE: ${{ inputs.target_tree }}
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'hosted scope' }
          if ($env:TARGET -notmatch '^[0-9a-f]{40}$' -or $env:TREE -notmatch '^[0-9a-f]{40}$') { throw 'invalid pin' }
          if ((git -C source rev-parse HEAD) -ne $env:TARGET -or (git -C source rev-parse 'HEAD^{tree}') -ne $env:TREE) { throw 'source mismatch' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/evidence"
          git -C source rev-parse HEAD 'HEAD^{tree}' | Out-File "$env:RUNNER_TEMP/evidence/source.txt"
      - name: Bounded stock Python CIM experiment
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TOOL_CACHE 'Python/3.11.9/x64/python.exe'
          if (-not (Test-Path $base)) { throw 'observed Python missing' }
          & $base helpers/.github/native-proof/cim_probe.py --source "$env:GITHUB_WORKSPACE/source" --evidence "$env:RUNNER_TEMP/evidence" --first '${{ matrix.first }}'
          if ($LASTEXITCODE -ne 0) { throw 'diagnostic collector failed' }
          git -C source status --porcelain | Out-File "$env:RUNNER_TEMP/evidence/status.txt"
          if (git -C source status --porcelain) { throw 'source modified' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cim-probe-${{ matrix.first }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
