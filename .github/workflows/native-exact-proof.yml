name: Native Windows guarded query controls (not release acceptance)
on:
  workflow_dispatch:
    inputs:
      target_ref:
        type: string
        required: true
      target_tree:
        type: string
        required: true
permissions:
  contents: read
jobs:
  controls:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: helpers
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
          path: source
      - name: Verify source and disposable scope
        shell: pwsh
        env:
          TARGET: ${{ inputs.target_ref }}
          TREE: ${{ inputs.target_tree }}
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'hosted scope' }
          if ($env:TARGET -notmatch '^[0-9a-f]{40}$' -or $env:TREE -notmatch '^[0-9a-f]{40}$') { throw 'invalid pin' }
          if ((git -C source rev-parse HEAD) -ne $env:TARGET -or (git -C source rev-parse 'HEAD^{tree}') -ne $env:TREE) { throw 'source mismatch' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/evidence"
          git -C source rev-parse HEAD 'HEAD^{tree}' | Out-File "$env:RUNNER_TEMP/evidence/source.txt"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
      - name: Disposable exact Python 3.11.9 test environment
        shell: pwsh
        working-directory: source
        run: |
          $base = Join-Path $env:RUNNER_TOOL_CACHE 'Python/3.11.9/x64/python.exe'
          if (-not (Test-Path $base)) { throw 'observed Python 3.11.9 runtime missing' }
          & $base -c "import sys; assert sys.version_info[:3] == (3,11,9); print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw 'base runtime mismatch' }
          uv sync --locked --python "$base" --extra dev
          if ($LASTEXITCODE -ne 0) { throw 'test dependencies failed' }
      - name: Real guarded canonical child and self query controls
        shell: pwsh
        run: |
          source/.venv/Scripts/python.exe helpers/.github/native-proof/native_env_control.py --source "$env:GITHUB_WORKSPACE/source" --evidence "$env:RUNNER_TEMP/evidence"
          if ($LASTEXITCODE -ne 0) { throw 'control collector failed, inspect artifacts' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-guarded-query-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
