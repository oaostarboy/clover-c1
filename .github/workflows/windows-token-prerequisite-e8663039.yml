name: Windows disposable non-admin account prerequisite
on:
  # Review gate: only an explicit post-review push to this dedicated branch runs it.
  push:
    branches: ['proof/windows-real-account-prerequisite']
    paths:
      - '.github/owner-worker-proof/**'
      - '.github/workflows/windows-token-prerequisite-e8663039.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-prerequisite:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Select one interpreter and parse fixture only
        shell: pwsh
        run: |
          $python = (Get-Command python.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          if (-not [IO.Path]::IsPathFullyQualified($python) -or -not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'One absolute Python executable required' }
          "ACCOUNT_PROOF_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python -I -m py_compile .github/owner-worker-proof/restricted_token.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in Get-ChildItem .github/owner-worker-proof/*.ps1) {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          & $python -I .github/owner-worker-proof/test_restricted_token.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I .github/owner-worker-proof/test_disposable_account.py
          exit $LASTEXITCODE
      - name: Prove real account profile logon access and registration directory once
        shell: pwsh
        run: |
          & .github/owner-worker-proof/token_prerequisite.ps1 -Python $env:ACCOUNT_PROOF_PYTHON -Evidence "$env:RUNNER_TEMP/account-prerequisite"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: account-prerequisite-${{ github.run_id }}
          path: ${{ runner.temp }}/account-prerequisite
          if-no-files-found: error
