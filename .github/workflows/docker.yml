name: Exact-source disposable Docker proof (no publication)
# Temporary helper-ref implementation of registered docker.yml, NOT a product
# workflow change. It checks out the independently reviewed target separately.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact independently reviewed candidate commit
        type: string
        required: true
      target_tree:
        description: Exact independently reviewed candidate tree
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: docker-proof-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  proof:
    name: Exact-source Docker build and integration / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_TREE: ${{ inputs.target_tree }}
      HELPER_SHA: ${{ github.sha }}
      IMAGE: clover-proof:${{ github.run_id }}-${{ matrix.arch }}
      CLOVER_TEST_FILE_RETRIES: '0'
      CLOVER_TEST_WORKERS: '2'
    steps:
      - name: Checkout exact candidate, not helper workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
      - name: Require disposable runner and exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e "$HOME/.clover"
          [[ $TARGET_REF =~ ^[0-9a-f]{40}$ && $TARGET_TREE =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_REF" = 71d2e92e3ba3c80fa67114f716779042059c059e
          test "$TARGET_TREE" = f71eda7f392dd139da6af604042061917a5f8814
          test "$(git rev-parse HEAD)" = "$TARGET_REF"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git replace -l)"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p "$RUNNER_TEMP/evidence"
          printf 'target_sha=%s\ntarget_tree=%s\nhelper_sha=%s\nplatform=%s\n' \
            "$TARGET_REF" "$TARGET_TREE" "$HELPER_SHA" '${{ matrix.platform }}' \
            > "$RUNNER_TEMP/evidence/source-pins.txt"
      - name: Build actual candidate image, never publish
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain --platform '${{ matrix.platform }}' \
            --build-arg "CLOVER_GIT_SHA=$TARGET_REF" -t "$IMAGE" . \
            2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
          docker image inspect "$IMAGE" > "$RUNNER_TEMP/evidence/image-inspect.json"
          docker run --rm --network none --entrypoint /opt/clover/.venv/bin/python "$IMAGE" \
            -c 'import json,pathlib,sys; d=json.loads(pathlib.Path("/etc/clover/image-provenance.json").read_text()); print(json.dumps(d)); assert d["revision"]==sys.argv[1]' \
            "$TARGET_REF" | tee "$RUNNER_TEMP/evidence/provenance.json"
      - name: Install isolated test toolchain
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
      - name: Install candidate's locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev
      - name: Exercise every Docker integration file with unique JUnit
        shell: bash
        env:
          CLOVER_TEST_IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          status=0
          for file in tests/docker/test_*.py; do
            name=$(basename "$file" .py)
            if bash scripts/run_tests.sh "$file" \
              --junitxml="$RUNNER_TEMP/evidence/$name.xml" \
              > "$RUNNER_TEMP/evidence/$name.log" 2>&1; then
              printf '%s\t0\n' "$file" >> "$RUNNER_TEMP/evidence/exits.tsv"
            else
              code=$?
              printf '%s\t%s\n' "$file" "$code" >> "$RUNNER_TEMP/evidence/exits.tsv"
              status=1
            fi
          done
          git diff --exit-code
          git diff --cached --exit-code
          exit "$status"
      - name: Require complete nonempty JUnit with no waived cases
        if: always()
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          evidence = Path(os.environ['EVIDENCE'])
          evidence.mkdir(parents=True, exist_ok=True)
          expected = sorted(Path('tests/docker').glob('test_*.py'))
          problems = [] if expected else ['no expected Docker integration files']
          results = []
          for source in expected:
              expected_junit = evidence / (source.stem + '.xml')
              entry = {'file': str(source), 'junit': expected_junit.name}
              try:
                  root = ET.parse(expected_junit).getroot()
                  cases = list(root.iter('testcase'))
                  nonpassing = [case.get('name') for case in cases if
                      case.find('skipped') is not None or case.find('failure') is not None or
                      case.find('error') is not None]
                  suite_bad = any(int(suite.get(key, '0')) != 0
                      for suite in root.iter('testsuite') for key in ['failures', 'errors', 'skipped'])
                  entry.update(tests=len(cases), nonpassing=nonpassing)
                  if not cases or nonpassing or suite_bad:
                      problems.append(str(source) + ': empty or non-passing JUnit')
              except (OSError, ET.ParseError, ValueError) as exc:
                  entry['error'] = type(exc).__name__
                  problems.append(str(source) + ': missing or invalid JUnit')
              results.append(entry)
          summary = {'expected_files': len(expected), 'results': results, 'problems': problems}
          (evidence / 'junit-acceptance.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary))
          raise SystemExit(1 if problems else 0)
          PY
      - name: Preserve exact source, build and per-file evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-proof-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
