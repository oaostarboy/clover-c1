name: Release POSIX gateway-running updater acceptance
on:
  push:
    branches: [ci/release-posix-acceptance]
permissions:
  contents: read
jobs:
  gateway-update:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      FROM_SHA: c200294b5ed85a9b21410c85b2b76191b6a2e29a
      TO_BRANCH: ci/release-posix-acceptance
      API_PORT: 18791
    steps:
      - name: Install old candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/oaostarboy/clover-c1/ci/release-posix-acceptance/scripts/install.sh -o /tmp/install.sh
          bash /tmp/install.sh --branch main --commit "$FROM_SHA" --non-interactive --skip-setup --skip-browser --skip-computer-use
          echo "CLOVER_HOME=$HOME/.clover" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$HOME/.clover/clover-c1" >> "$GITHUB_ENV"
          echo "CLOVER_BIN=$HOME/.clover/clover-c1/venv/bin/clover" >> "$GITHUB_ENV"
          "$HOME/.clover/clover-c1/venv/bin/clover" --version
          test "$(git -C "$HOME/.clover/clover-c1" rev-parse HEAD)" = "$FROM_SHA"
      - name: Start real gateway
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CLOVER_HOME"
          printf '\nAPI_SERVER_ENABLED=true\nAPI_SERVER_KEY=acceptance-test-key-123456789\nAPI_SERVER_PORT=%s\nAPI_SERVER_HOST=127.0.0.1\n' "$API_PORT" >> "$CLOVER_HOME/.env"
          "$CLOVER_BIN" gateway run --replace > "$RUNNER_TEMP/gateway.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/gateway.pid"
          ready=0
          for _ in $(seq 1 90); do
            if python3 -c "import socket,sys;s=socket.create_connection(('127.0.0.1',${API_PORT}),1);s.close()"; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { cat "$RUNNER_TEMP/gateway.log"; exit 1; }
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          state=json.load(open(os.path.join(os.environ['CLOVER_HOME'],'gateway_state.json')))
          print('PRE_UPDATE_GATEWAY_PID='+str(state['pid']))
          print('PRE_UPDATE_GATEWAY_SHA='+str(state.get('code_sha','')))
          PY
          echo "gateway pre-update pid=$PRE_UPDATE_GATEWAY_PID sha=$PRE_UPDATE_GATEWAY_SHA API port=$API_PORT bound"
      - name: Update from old SHA while gateway runs
        shell: bash
        run: |
          set -euo pipefail
          "$CLOVER_BIN" update --branch "$TO_BRANCH" --yes --gateway
          TARGET_SHA="$(git -C "$INSTALL_DIR" rev-parse HEAD)"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "update landed at $TARGET_SHA"
      - name: Assert post-update gateway health for 90 seconds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, socket, subprocess, time
          home=os.environ['CLOVER_HOME']; port=int(os.environ['API_PORT'])
          target=os.environ['TARGET_SHA']
          pre_pid=int(os.environ['PRE_UPDATE_GATEWAY_PID'])
          pre_sha=os.environ.get('PRE_UPDATE_GATEWAY_SHA','')
          deadline=time.time()+180
          while time.time()<deadline:
              try:
                  with socket.create_connection(('127.0.0.1',port),1): break
              except OSError: time.sleep(2)
          else: raise SystemExit('gateway did not recover within 180 seconds')
          for n in range(30):
              with socket.create_connection(('127.0.0.1',port),2): pass
              try: state=json.load(open(os.path.join(home,'gateway_state.json')))
              except Exception as e: raise SystemExit(f'gateway state unreadable: {e}')
              assert state.get('gateway_state')=='running', state
              assert state.get('restart_requested') is not True, state
              assert int(state.get('pid',-1)) != pre_pid, f'gateway PID did not change across update: {state}'
              assert state.get('code_sha') == target, f'gateway code_sha={state.get("code_sha")}, wanted {target}; old={pre_sha}'
              time.sleep(3)
          print('PASS: restarted gateway PID and target code SHA verified; API bound, running, no stale restart request, continuous health for 90 seconds')
          PY
      - name: Gateway log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/gateway.log
          if-no-files-found: ignore
