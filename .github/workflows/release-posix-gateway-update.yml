name: Release POSIX gateway-running updater acceptance
on:
  push:
    branches: [ci/release-posix-acceptance]
permissions:
  contents: read
jobs:
  gateway-update:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      FROM_SHA: c200294b5ed85a9b21410c85b2b76191b6a2e29a
      TO_BRANCH: fix/release-harness-20260929
      EXPECTED_TARGET_SHA: fe801ad8bb0c3127094ee88927beaf5477f849f5
      API_PORT: 18791
    steps:
      - name: Install old candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/oaostarboy/clover-c1/ci/release-posix-acceptance/scripts/install.sh -o /tmp/install.sh
          bash /tmp/install.sh --branch main --commit "$FROM_SHA" --non-interactive --skip-setup --skip-browser --skip-computer-use
          echo "CLOVER_HOME=$HOME/.clover" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$HOME/.clover/clover-c1" >> "$GITHUB_ENV"
          echo "CLOVER_BIN=$HOME/.clover/clover-c1/venv/bin/clover" >> "$GITHUB_ENV"
          "$HOME/.clover/clover-c1/venv/bin/clover" --version
          test "$(git -C "$HOME/.clover/clover-c1" rev-parse HEAD)" = "$FROM_SHA"
          git -C "$HOME/.clover/clover-c1" checkout -b "$TO_BRANCH" "$FROM_SHA"
          git -C "$HOME/.clover/clover-c1" branch --set-upstream-to="origin/$TO_BRANCH" "$TO_BRANCH"
          test "$(git -C "$HOME/.clover/clover-c1" rev-parse HEAD)" = "$FROM_SHA"
          test "$(git -C "$HOME/.clover/clover-c1" rev-parse --abbrev-ref --symbolic-full-name '@{u}')" = "origin/$TO_BRANCH"
      - name: Start real gateway
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CLOVER_HOME"
          printf '\nAPI_SERVER_ENABLED=true\nAPI_SERVER_KEY=acceptance-test-key-123456789\nAPI_SERVER_PORT=%s\nAPI_SERVER_HOST=127.0.0.1\n' "$API_PORT" >> "$CLOVER_HOME/.env"
          "$CLOVER_BIN" gateway run --replace > "$RUNNER_TEMP/gateway.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/gateway.pid"
          ready=0
          for _ in $(seq 1 90); do
            if python3 -c "import socket,sys;s=socket.create_connection(('127.0.0.1',${API_PORT}),1);s.close()"; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { cat "$RUNNER_TEMP/gateway.log"; exit 1; }
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          state=json.load(open(os.path.join(os.environ['CLOVER_HOME'],'gateway_state.json')))
          print('PRE_UPDATE_GATEWAY_PID='+str(state['pid']))
          print('PRE_UPDATE_GATEWAY_SHA='+str(state.get('code_sha','')))
          PY
          echo "Pre-update gateway identity captured; API port $API_PORT is bound"
      - name: Linux second interpreter and custom systemd gateway
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          OTHER_HOME="$HOME/.clover-other"
          OTHER_INSTALL="$OTHER_HOME/clover-c1"
          export CLOVER_HOME="$OTHER_HOME" CLOVER_INSTALL_DIR="$OTHER_INSTALL"
          bash /tmp/install.sh --branch main --commit "$FROM_SHA" --non-interactive --skip-setup --skip-browser --skip-computer-use
          mkdir -p "$OTHER_HOME"
          printf '\nAPI_SERVER_ENABLED=true\nAPI_SERVER_KEY=acceptance-test-other-123456789\nAPI_SERVER_PORT=18792\nAPI_SERVER_HOST=127.0.0.1\n' >> "$OTHER_HOME/.env"
          UNIT="clover-acceptance-other-$GITHUB_RUN_ID"
          echo "OTHER_HOME=$OTHER_HOME" >> "$GITHUB_ENV"
          echo "OTHER_INSTALL=$OTHER_INSTALL" >> "$GITHUB_ENV"
          echo "OTHER_UNIT=$UNIT" >> "$GITHUB_ENV"
          systemd-run --user --unit="$UNIT" --collect --setenv="CLOVER_HOME=$OTHER_HOME" --working-directory="$OTHER_INSTALL" "$OTHER_INSTALL/venv/bin/clover" gateway run
          ready=0
          for _ in $(seq 1 90); do
            if python3 -c "import socket;s=socket.create_connection(('127.0.0.1',18792),1);s.close()" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { systemctl --user status "$UNIT" --no-pager; exit 1; }
          OTHER_PID="$(systemctl --user show "$UNIT" --property=MainPID --value)"
          test "$OTHER_PID" != 0
          echo "OTHER_PID=$OTHER_PID" >> "$GITHUB_ENV"
          test "$(git -C "$OTHER_INSTALL" rev-parse HEAD)" = "$FROM_SHA"
          echo "unrelated install started: custom unit=$UNIT pid=$OTHER_PID second interpreter=$OTHER_INSTALL"
      - name: Update from old SHA while gateway runs
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            cat > "$RUNNER_TEMP/watch-unrelated.py" <<'PY'
          import json, os, socket, subprocess, sys, time
          home=os.environ['OTHER_HOME']; unit=os.environ['OTHER_UNIT']; expected=os.environ['OTHER_PID']; sha=os.environ['FROM_SHA']
          sentinel=os.path.join(os.environ['RUNNER_TEMP'],'unrelated-gateway-monitor.failed')
          while os.path.exists(os.path.join(os.environ['RUNNER_TEMP'],'unrelated-gateway-monitor.running')):
              try:
                  pid=subprocess.check_output(['systemctl','--user','show',unit,'--property=MainPID','--value'],text=True).strip()
                  assert pid==expected and pid!='0', f'MainPID changed: {pid}'
                  subprocess.run(['systemctl','--user','is-active','--quiet',unit],check=True)
                  with socket.create_connection(('127.0.0.1',18792),2): pass
                  assert subprocess.check_output(['git','-C',os.environ['OTHER_INSTALL'],'rev-parse','HEAD'],text=True).strip()==sha
                  state=json.load(open(os.path.join(home,'gateway_state.json')))
                  assert int(state.get('pid',-1))==int(expected) and state.get('gateway_state')=='running', state
                  rows=subprocess.check_output(['ps','-axo','pid=,command='],text=True).splitlines()
                  own=[r for r in rows if os.environ['OTHER_INSTALL'] in r and 'gateway' in r and ' run' in r and ' update ' not in r]
                  assert len(own)==1, f'expected one unrelated gateway process: {own}'
              except Exception as e:
                  open(sentinel,'w').write(str(e)); sys.exit(1)
              time.sleep(1)
          PY
            touch "$RUNNER_TEMP/unrelated-gateway-monitor.running"
            python3 "$RUNNER_TEMP/watch-unrelated.py" > "$RUNNER_TEMP/unrelated-gateway-monitor.log" 2>&1 &
            echo "$!" > "$RUNNER_TEMP/unrelated-gateway-monitor.pid"
            sleep 2
            test ! -e "$RUNNER_TEMP/unrelated-gateway-monitor.failed"
          fi
          "$CLOVER_BIN" update --branch "$TO_BRANCH" --yes --gateway
          TARGET_SHA="$(git -C "$INSTALL_DIR" rev-parse HEAD)"
          test "$TARGET_SHA" = "$EXPECTED_TARGET_SHA"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "update landed at pinned target $TARGET_SHA"
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "Linux unrelated-unit checks are performed throughout the final health window"
          fi
      - name: Assert post-update gateway health for 90 seconds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, socket, subprocess, time
          home=os.environ['CLOVER_HOME']; port=int(os.environ['API_PORT'])
          target=os.environ['TARGET_SHA']
          pre_pid=int(os.environ['PRE_UPDATE_GATEWAY_PID'])
          pre_sha=os.environ.get('PRE_UPDATE_GATEWAY_SHA','')
          deadline=time.time()+180
          state={}
          while time.time()<deadline:
              try: state=json.load(open(os.path.join(home,'gateway_state.json')))
              except Exception: state={}
              if int(state.get('pid',-1)) != pre_pid and state.get('code_sha') == target:
                  break
              time.sleep(2)
          else:
              restart_log=os.path.join(os.environ['RUNNER_TEMP'],'gateway-post-update.log')
              if os.path.exists(restart_log): print('post-update gateway launch output:',open(restart_log,errors='replace').read())
              raise SystemExit(f'gateway did not restart onto target code within 180 seconds; old pid={pre_pid}, old sha={pre_sha}, state={state}')
          for n in range(30):
              with socket.create_connection(('127.0.0.1',port),2): pass
              state=json.load(open(os.path.join(home,'gateway_state.json')))
              assert state.get('gateway_state')=='running', state
              assert state.get('restart_requested') is not True, state
              assert int(state.get('pid',-1)) != pre_pid, f'gateway PID reverted across update: {state}'
              assert state.get('code_sha') == target, f'gateway code_sha={state.get("code_sha")}, wanted {target}; old={pre_sha}'
              rows=subprocess.check_output(['ps','-axo','pid=,command='],text=True).splitlines()
              own=[r for r in rows if os.environ['INSTALL_DIR'] in r and 'gateway' in r and ' run' in r and ' update ' not in r]
              assert len(own)==1, f'expected exactly one gateway process for primary install; found {own}'
              if os.environ['RUNNER_OS']=='Linux':
                  other_pid=subprocess.check_output(['systemctl','--user','show',os.environ['OTHER_UNIT'],'--property=MainPID','--value'],text=True).strip()
                  assert other_pid==os.environ['OTHER_PID'] and other_pid!='0', f'unrelated unit PID changed: {other_pid}'
                  subprocess.run(['systemctl','--user','is-active','--quiet',os.environ['OTHER_UNIT']],check=True)
                  with socket.create_connection(('127.0.0.1',18792),2): pass
                  assert subprocess.check_output(['git','-C',os.environ['OTHER_INSTALL'],'rev-parse','HEAD'],text=True).strip()==os.environ['FROM_SHA']
              time.sleep(3)
          print('PASS: restarted gateway PID and target code SHA verified; exactly one primary process, API bound, running, no stale restart request; Linux unrelated unit preserved; continuous health for 90 seconds')
          PY
          if [ "$RUNNER_OS" = "Linux" ]; then
            rm -f "$RUNNER_TEMP/unrelated-gateway-monitor.running"
            wait "$(cat "$RUNNER_TEMP/unrelated-gateway-monitor.pid")"
            test ! -e "$RUNNER_TEMP/unrelated-gateway-monitor.failed"
            echo "PASS: unrelated custom systemd gateway identity, process count, API, state, and code SHA continuously monitored across updater and health window"
          fi
      - name: Gateway log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/gateway.log
            ${{ runner.temp }}/gateway-post-update.log
          if-no-files-found: ignore
