name: Narrow Windows secure-reader offline proof
on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
        type: string
      target_tree:
        required: true
        type: string
      diagnostic_only:
        type: boolean
        default: false
      windows_only:
        type: boolean
        default: false
      reader_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  proof:
    name: ${{ matrix.os }} / secure reader
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.diagnostic_only || inputs.windows_only) && '["windows-latest"]' || '["windows-latest","ubuntu-latest","macos-latest"]') }}
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_TREE: ${{ inputs.target_tree }}
      MODE: acceptance
      READER_ONLY: ${{ inputs.reader_only }}
      SLICE_INDEX: '0'
      SLICES: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.target_sha }}
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: source/uv.lock
      - name: Locked disposable test dependencies, no retry
        working-directory: source
        shell: bash
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web --extra messaging
      - name: Diagnose actual native directory ACLs without changes
        if: runner.os == 'Windows'
        working-directory: source
        shell: bash
        run: .venv/Scripts/python.exe ../helpers/.github/native-proof/reader_acl_diagnostic.py
      - name: Canonical guarded source-pinned offline checks, no retry
        if: ${{ ! inputs.diagnostic_only }}
        shell: bash
        run: python helpers/.github/native-proof/joined_run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reader-${{ runner.os }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
