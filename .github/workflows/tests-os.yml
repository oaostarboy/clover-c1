name: Windows diagnostic stdlib controls (branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
      - shell: bash
        run: |
          uv python install 3.11.14
          uv run --no-project --python 3.11.14 .github/native-proof/diagnostic_control.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic-control-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
