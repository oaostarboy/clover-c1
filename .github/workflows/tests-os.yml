name: Narrow isolated quota boundary proof
on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
        type: string
      target_tree:
        required: true
        type: string
      inventory_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  quota:
    name: ${{ matrix.os }} / isolated quota
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.inventory_only && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      INVENTORY_ONLY: ${{ inputs.inventory_only }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_TREE: ${{ inputs.target_tree }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.target_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: ${{ runner.os != 'Windows' && !inputs.inventory_only }}
        with:
          ref: a5d8d024212400ed7add239287b0569806c7ce4a
          path: baseline
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: false
      - name: Owned pinned environment only, no dependency retries
        shell: bash
        run: |
          uv python install 3.11
          uv venv --python 3.11 source/.venv
          if [ "$RUNNER_OS" = Windows ]; then PY=source/.venv/Scripts/python.exe; else PY=source/.venv/bin/python; fi
          uv pip install --python "$PY" -r helpers/.github/native-proof/quota-requirements.txt
      - name: Canonical exact-source offline quota checks, no retries
        shell: bash
        run: python helpers/.github/native-proof/quota_run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quota-${{ runner.os }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
