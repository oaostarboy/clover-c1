name: Joined presence renderer ACK exact-source proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer:
    name: ${{ matrix.os }} / renderer ACK and state
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 79e5df1357c0a7bd14788e512d30e2293731374f
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
      - name: Install locked renderer dependencies (no retry)
        working-directory: source
        shell: bash
        run: npm ci --include-workspace-root --workspace apps/desktop --workspace packages/clover-ui --workspace apps/shared
      - name: Exact-source offline renderer ACK tests (no retry)
        shell: bash
        run: python helpers/.github/native-proof/renderer_run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: renderer-${{ runner.os }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
