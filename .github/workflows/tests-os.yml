name: Independent native test-clock diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clocks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
      - name: Measure the actual native CPython3.11 clocks
        shell: bash
        run: |
          uv python install 3.11
          uv run --python 3.11 --no-project .github/native-proof/windows_clock_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-clock-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
