name: Windows original-cohort ACK trace (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    name: Windows / original acceptance slice ${{ matrix.slice }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        slice: [5]
    env:
      MODE: acceptance
      SLICE_INDEX: ${{ matrix.slice }}
      SLICES: "8"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 4414d6fa8b8e38fc5a537556078ce72d4de87c6d
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: source/uv.lock
      - name: Install locked isolated test dependencies
        working-directory: source
        shell: bash
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web --extra messaging
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
      - name: Install locked renderer dependencies
        working-directory: source
        shell: bash
        run: npm ci --include-workspace-root --workspace apps/desktop --workspace packages/clover-ui --workspace apps/shared
      - name: Observe original acceptance cohort with unchanged assertions clocks guards
        shell: bash
        run: python helpers/.github/native-proof/joined_run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cohort-observation-${{ runner.os }}-${{ matrix.slice }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
