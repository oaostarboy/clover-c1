name: Presence candidate native suite (test branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.scope }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        scope: [diagnose]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c720b1ad5f68c213c589fd8a7bf26cd40140323e
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: source/uv.lock
      - name: Install locked test-only environment (no retry)
        working-directory: source
        shell: bash
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web --extra messaging
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
      - name: Install locked desktop renderer test dependencies (no retry)
        working-directory: source
        shell: bash
        run: npm ci --include-workspace-root --workspace apps/desktop --workspace packages/clover-ui --workspace apps/shared
      - name: Exact-source canonical suite (no retries)
        shell: bash
        env:
          SCOPE: ${{ matrix.scope }}
        run: python helpers/.github/native-proof/presence_run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: presence-${{ matrix.os }}-${{ strategy.job-index }}-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
