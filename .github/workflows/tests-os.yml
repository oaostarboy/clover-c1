name: macOS cold audit exact-source diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a5d8d024212400ed7add239287b0569806c7ce4a
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: source/uv.lock
      - name: Install locked isolated test dependencies (no retry)
        working-directory: source
        shell: bash
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web --extra messaging
      - name: Canonical exact-source cold targets (no retries)
        shell: bash
        run: python helpers/.github/native-proof/cold_run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-cold-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
