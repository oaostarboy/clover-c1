name: Joined guard cold-child descriptor diagnosis (not acceptance)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MODE: preflight
      JOIN_FD_DIAGNOSTIC: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e6a5f1d7472b4c43491bef0eb67782c6c153bca6
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: source/uv.lock
      - name: Install same locked isolated test dependencies
        working-directory: source
        shell: bash
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web --extra messaging
      - name: Original whole readonly-native file with audit refusal unchanged
        shell: bash
        run: python helpers/.github/native-proof/joined_run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guard-descriptor-Windows-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
