name: Independently reviewed wrapper guard native macOS
on:
  push:
    branches: ['ci/wrapper-macos-final-20261023']
permissions:
  contents: read
concurrency:
  group: guard-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  updater:
    name: guard / ${{ matrix.os }} / ${{ matrix.base }} / ${{ matrix.entry }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        base: [release, main, fixed]
        entry: [terminal, gateway]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e1eac70b63afcbf4152cb7c8e965f997d93cca32
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: false
      - name: Execute normal updater with real held work and no driver restart
        shell: bash
        env:
          BASE: ${{ matrix.base }}
          ENTRY: ${{ matrix.entry }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          old=32d3e6728c71d1f7c8684b7b41ac1785cb8117a9
          if [[ $BASE == main ]]; then old=9535350bee1d57cf7e466672e6f416403886bec1; fi
          target=e1eac70b63afcbf4152cb7c8e965f997d93cca32
          tree=be3c82d011877711d3d40c897488fc0637b035dc
          if [[ $BASE == fixed ]]; then
            old=e1eac70b63afcbf4152cb7c8e965f997d93cca32
            target=d934abfc5d8880e481e93826d7cfe4400378fc2c
            tree=d41aaf4b89d993817f872b5c0f7356656310904d
          fi
          uv run --no-project --with psutil python helpers/.github/native-proof/guard_native_upgrade.py \
            --source "$GITHUB_WORKSPACE/source" --old "$old" --entry "$ENTRY" \
            --target "$target" --tree "$tree" \
            --evidence "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guard-${{ matrix.os }}-${{ matrix.base }}-${{ matrix.entry }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error