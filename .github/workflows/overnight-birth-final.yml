name: Final integrated native Windows birth precision acceptance
'on':
  push:
    branches:
    - ci/overnight-birth-final-20261023
permissions:
  contents: read
concurrency:
  group: overnight-birth-final-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native-witness:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CLOVER_TEST_WORKERS: '1'
      CLOVER_TEST_FILE_RETRIES: '0'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0f073c982443d9cb3f7ed5c4271100a148ae6c69
        persist-credentials: false
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        enable-cache: false
    - name: Measure native process facts against independent psutil
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/evidence"

        uv venv .venv --python 3.12

        uv sync --locked --extra dev --python .venv/Scripts/python.exe

        bash scripts/run_tests.sh tests/clover_cli/test_windows_process_witness.py
        tests/clover_cli/test_windows_process_witness_native.py tests/clover_cli/test_windows_update_receipt_handoff.py
        -vv --tb=short > "$RUNNER_TEMP/evidence/native-tests.log" 2>&1

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: windows-native-witness-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/evidence
        if-no-files-found: error
  updater:
    name: Final Windows automatic / ${{ matrix.entry }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        entry:
        - terminal
        - gateway
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: helpers
        persist-credentials: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0f073c982443d9cb3f7ed5c4271100a148ae6c69
        path: source
        fetch-depth: 0
        persist-credentials: false
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        enable-cache: false
    - name: Exact final fixed-base automatic update with held work; no driver restart
      shell: bash
      env:
        ENTRY: ${{ matrix.entry }}
      run: "set -euo pipefail\nuv run --no-project --with psutil python helpers/.github/native-proof/guard_native_upgrade.py\
        \ \\\n  --source \"$GITHUB_WORKSPACE/source\" --old 0f073c982443d9cb3f7ed5c4271100a148ae6c69\
        \ --entry \"$ENTRY\" \\\n  --target 8ca9dbcd0a8d4b643d270795d56cf572019bdbfb\
        \ --tree e76b9d5985129bdbc81176b0a3b9a8e8fe88c7a6 --fixed-base 0f073c982443d9cb3f7ed5c4271100a148ae6c69\
        \ \\\n  --evidence \"$RUNNER_TEMP/evidence\""
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: birth-final-windows-${{ matrix.entry }}-${{ github.run_id }}
        path: ${{ runner.temp }}/evidence
        if-no-files-found: error
    needs: native-witness
  windows-rollback:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: helpers
        persist-credentials: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0f073c982443d9cb3f7ed5c4271100a148ae6c69
        path: source
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: 3.11.9
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.9.28
        enable-cache: false
    - name: Actual failed promotion preserves newest state
      shell: pwsh
      run: 'python helpers/.github/windows-external-runtime/probe.py --source source
        --target-sha 0f073c982443d9cb3f7ed5c4271100a148ae6c69 --target-tree 85ab9094f93aedd955e178f59d0f0eb9c67a543f
        --old-sha 9535350bee1d57cf7e466672e6f416403886bec1 --case smoke-rollback --evidence
        "$env:RUNNER_TEMP/evidence"

        if ($LASTEXITCODE -ne 0) { throw ''Native rollback probe failed'' }

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: windows-rollback-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/evidence
        if-no-files-found: error
    needs: native-witness
  windows-fresh:
    name: Exact final native Windows fresh install and feature contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-2025
    env:
      OLD_REF: v1.5.6
      TARGET_REF: 0f073c982443d9cb3f7ed5c4271100a148ae6c69
      TARGET_TREE: 85ab9094f93aedd955e178f59d0f0eb9c67a543f
      NEXT_REF: ci/native-next/overnight-birth-final-20261023
      NEXT_SHA: 8ca9dbcd0a8d4b643d270795d56cf572019bdbfb
      NEXT_TREE: e76b9d5985129bdbc81176b0a3b9a8e8fe88c7a6
      OLD_SHA: 32d3e6728c71d1f7c8684b7b41ac1785cb8117a9
      SETUP: zyra
      UPDATE_PATH: cli
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        path: helpers
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: 0f073c982443d9cb3f7ed5c4271100a148ae6c69
        fetch-depth: 0
        persist-credentials: false
        path: source
    - name: macOS/Linux fresh native installer and installed feature contracts
      if: runner.os != 'Windows'
      shell: bash
      run: bash helpers/.github/native-proof/posix.sh fresh
    - name: Windows fresh native installer and installed feature contracts
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./helpers/.github/native-proof/windows.ps1 -Mode fresh
    - name: Preserve actual evidence and row outcome
      if: always()
      shell: bash
      env:
        ROW_STATUS: ${{ job.status }}
      run: 'mkdir -p "$RUNNER_TEMP/evidence"

        python helpers/.github/native-proof/row.py

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: fresh-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/evidence
        if-no-files-found: error
    needs: native-witness
