name: Corrected-pin macOS full fresh installer acceptance
on:
  push:
    branches: ['ci/macos-fresh-install-correction-20261023']
permissions:
  contents: read
concurrency:
  group: macos-fresh-correction-${{ github.run_id }}
  cancel-in-progress: false
env:
  OLD_REF: v1.5.6
  TARGET_REF: e1eac70b63afcbf4152cb7c8e965f997d93cca32
  TARGET_TREE: be3c82d011877711d3d40c897488fc0637b035dc
  NEXT_REF: ci/native-next/macos-fresh-e1eac70b-20261023
  NEXT_SHA: 5c4fe3f358743477d4ac9cad3c7836f704f669e0
  NEXT_TREE: 5b42f45c7dd25206345b9553c26d9b926493d3af
  OLD_SHA: 32d3e6728c71d1f7c8684b7b41ac1785cb8117a9
  SETUP: zyra
  UPDATE_PATH: cli
jobs:
  fresh:
    name: macOS-15 full fresh installer, installed health and contracts
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: helpers
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e1eac70b63afcbf4152cb7c8e965f997d93cca32
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Bounded native Electron network cause probe
        shell: bash
        run: node helpers/.github/native-proof/electron_network_probe.mjs "$RUNNER_TEMP/evidence/electron-network-before.json"
      - name: Clean normal full installer, actual health and native feature contracts
        shell: bash
        run: bash helpers/.github/native-proof/posix.sh fresh
      - name: Read installed components and packaged desktop identity
        shell: bash
        run: |
          set -euo pipefail
          export CLOVER_HOME="$HOME/.clover"
          "$HOME/.clover/clover-c1/venv/bin/python" helpers/.github/native-proof/macos_components.py
      - name: Preserve bounded network causes after failed install
        if: failure()
        shell: bash
        run: node helpers/.github/native-proof/electron_network_probe.mjs "$RUNNER_TEMP/evidence/electron-network-after-failure.json"
      - name: Preserve exact row outcome
        if: always()
        shell: bash
        env:
          ROW_STATUS: ${{ job.status }}
        run: python helpers/.github/native-proof/row.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-full-fresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
