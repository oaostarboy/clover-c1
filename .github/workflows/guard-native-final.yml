name: Final delivery guard native legacy and repaired updater
on:
  push:
    branches: ['ci/guard-native-final-20261022']
permissions:
  contents: read
concurrency:
  group: guard-native-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  updater:
    name: guard / ${{ matrix.os }} / ${{ matrix.base }} / ${{ matrix.entry }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
        base: [release, main, fixed]
        entry: [terminal, gateway]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 6f9c16d8141e91886242f540caff2a3020dfebbe
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: false
      - name: Execute normal updater with real held work and no driver restart
        shell: bash
        env:
          BASE: ${{ matrix.base }}
          ENTRY: ${{ matrix.entry }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          old=32d3e6728c71d1f7c8684b7b41ac1785cb8117a9
          if [[ $BASE == main ]]; then old=9535350bee1d57cf7e466672e6f416403886bec1; fi
          if [[ $BASE == fixed ]]; then old=61ebcedded39b7c9c86021df268d21017747ddea; fi
          uv run --no-project --with psutil python helpers/.github/native-proof/guard_native_upgrade.py \
            --source "$GITHUB_WORKSPACE/source" --old "$old" --entry "$ENTRY" \
            --target 6f9c16d8141e91886242f540caff2a3020dfebbe \
            --tree c5174973f3746672100bd78416cf9f34a637cea7 \
            --evidence "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guard-${{ matrix.os }}-${{ matrix.base }}-${{ matrix.entry }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
  macos-rollback:
    # Same exact product already passed this row in run 39886792119.
    if: false
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 6f9c16d8141e91886242f540caff2a3020dfebbe
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: false
      - name: Actual failed promotion preserves newest state
        shell: bash
        run: |
          python3 helpers/.github/native-proof/macos_external_env.py --rollback-only \
            --source "$GITHUB_WORKSPACE/source" \
            --target-sha 6f9c16d8141e91886242f540caff2a3020dfebbe \
            --target-tree c5174973f3746672100bd78416cf9f34a637cea7 \
            --evidence "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guard-macos-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
  windows-rollback:
    # Same exact product already passed this row in run 39886792119.
    if: false
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          path: helpers
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: 6f9c16d8141e91886242f540caff2a3020dfebbe
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: false
      - name: Actual failed promotion preserves newest state
        shell: pwsh
        run: |
          python helpers/.github/windows-external-runtime/probe.py --source source --target-sha 6f9c16d8141e91886242f540caff2a3020dfebbe --target-tree c5174973f3746672100bd78416cf9f34a637cea7 --old-sha 9535350bee1d57cf7e466672e6f416403886bec1 --case smoke-rollback --evidence "$env:RUNNER_TEMP/evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Native rollback probe failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: guard-windows-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
