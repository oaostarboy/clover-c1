name: clover
version: 1.0.0
description: "Dashboard auth provider — OAuth 2.0 (authorization-code + PKCE) against Clover Portal. Auto-activates when a client_id is configured via either dashboard.oauth.client_id in config.yaml (canonical surface) or CLOVER_DASHBOARD_OAUTH_CLIENT_ID env var (operator override; Portal injects this at Fly.io provisioning). dashboard.oauth.portal_url / CLOVER_DASHBOARD_PORTAL_URL are optional and default to "
author: cloverc1
kind: backend
requires_env:
  - CLOVER_DASHBOARD_OAUTH_CLIENT_ID
